worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # Upstream: Flask API (Python — port 5050)
    # =========================================================================
    upstream flask_api {
        server 127.0.0.1:5050;
    }

    # =========================================================================
    # Upstream: Laravel (PHP — port 8000)
    # =========================================================================
    upstream laravel_app {
        server 127.0.0.1:8000;
    }

    # =========================================================================
    # Server utama — port 80
    # Akses: http://localhost
    # =========================================================================
    server {
        listen       80;
        server_name  localhost;

        client_max_body_size 20M;

        # ----------------------------------------------------------------
        # Proxy /api/* → Flask (Face Recognition API)
        # Semua request ke /api/ diteruskan ke Flask di port 5050
        # ----------------------------------------------------------------
        location /api/ {
            proxy_pass         http://flask_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # CORS untuk request dari browser
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'X-API-Key, Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ----------------------------------------------------------------
        # Proxy semua request lain → Laravel (PHP artisan serve)
        # ----------------------------------------------------------------
        location / {
            proxy_pass         http://laravel_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ----------------------------------------------------------------
        # Error pages
        # ----------------------------------------------------------------
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
